name: Update cards and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # every night, 03:17 UTC
  workflow_dispatch:        # lets you run it by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get card data (punk-records)
        uses: actions/checkout@v4
        with:
          repository: buhbbl/punk-records
          path: punk-records
          sparse-checkout: english/cards

      - name: Build data/cards.json
        run: python scripts/build_cards.py punk-records data

      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update card data" && git push)

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html style.css app.js _site/
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
